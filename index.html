<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SusAn — Download</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d0f;
      --surface:  #18181c;
      --border:   #2a2a32;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --text:     #e8e8f0;
      --muted:    #7a7a8c;
      --radius:   16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    /* subtle radial glow behind the card */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 30%, rgba(108,99,255,.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 3rem 2.5rem 2.5rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,.5);
    }

    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      box-shadow: 0 8px 24px rgba(108,99,255,.4);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 40%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      color: var(--muted);
      margin-top: .5rem;
      font-size: .95rem;
      line-height: 1.5;
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .meta {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }

    .meta span {
      display: flex;
      align-items: center;
      gap: .35rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: .6rem;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      padding: .85rem 2rem;
      border-radius: 12px;
      transition: opacity .2s, transform .2s, box-shadow .2s;
      box-shadow: 0 6px 20px rgba(108,99,255,.45);
      width: 100%;
      justify-content: center;
    }

    .btn:hover {
      opacity: .9;
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(108,99,255,.55);
    }

    .btn:active {
      transform: translateY(0);
    }

    .note {
      margin-top: 1.2rem;
      font-size: .78rem;
      color: var(--muted);
    }

    footer {
      margin-top: 2.5rem;
      font-size: .75rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">📱</div>
    <h1>SusAn</h1>
    <p class="tagline">The SusAn Android app — download the latest APK directly to your device.</p>

    <hr class="divider" />

    <div class="meta">
      <span>🤖 Android</span>
      <span>📦 APK</span>
      <span>🆓 Free</span>
    </div>

    <a class="btn" href="SusAn.apk" download>
      ⬇ Download APK
    </a>

    <p class="note">
      Allow installs from unknown sources in your Android settings before installing.
    </p>
  </div>

  <footer>
    &copy; 2026 SusAn &mdash; hosted on GitHub Pages
  </footer>

</body>
</html>
